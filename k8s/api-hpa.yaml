# PROPOSED - not applied to a real cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: survey-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: survey-api
  minReplicas: 3          # floor = zone-spread baseline, never below the PDB needs
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # relative to the 250m request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid flapping after traffic spikes
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
